# Datos de conexión a la base de datos de Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:gsc_db}
spring.datasource.username=${DB_USER:gsc_user}
spring.datasource.password=${DB_PASSWORD:gsc_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Puerto por defecto del servidor Tomcat
server.port=8081

# Configuración de Thymeleaf para desarrollo
spring.thymeleaf.cache=false

# Configuración de JWT
jwt.secret=${JWT_SECRET : 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION : 86400000}
