<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSC - Seleccionar Sala</title>
    
    <th:block th:replace="~{fragments/head :: head('GSC - Seleccionar Sala')}"></th:block>
    
    <style>
        .reg-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .campo-grupo {
            margin-bottom: 20px;
            text-align: left;
        }
        .campo-grupo label {
            display: block;
            margin-bottom: 6px;
            color: #4b5563;
            font-weight: 600;
        }
        .campo-grupo select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .campo-grupo select:focus {
            outline: none;
            border-color: #677d29;
        }
        .btn-registro {
            background-color: #677d29;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-registro:hover {
            background-color: #526420;
        }
    </style>
</head>
<body style="background-color: #f3f4f6;">

    <div th:replace="~{fragments/header :: admin-header}"></div>

    <div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="reg-box">
            <h2 style="color: #677d29; text-align: center; font-size: 24px; margin-bottom: 25px;">
                Seleccionar Sala a Monitorear
            </h2>
            
            <form th:action="@{/sala/monitoreo}" method="get">
                <div class="campo-grupo">
                    <label for="idSala">¿Qué sala vas a supervisar?</label>
                    <select id="idSala" name="idSala" required>
                        <option value="" disabled selected>-- Elige una sala --</option>
                        <option th:each="sala : ${salas}"
                                th:value="${sala.idSala}"
                                th:text="${'Sala ' + sala.idSala}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn-registro">Entrar a Monitoreo</button>
            </form>
        </div>
    </div>

</body>
</html>
