<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSC - Autenticación de Monitor</title>

    <th:block th:replace="~{fragments/head :: head('GSC - Autenticación de Monitor')}"></th:block>

    <style>
        .reg-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 100%;
        }
        .campo-grupo {
            margin-bottom: 20px;
            text-align: left;
        }
        .campo-grupo label {
            display: block;
            margin-bottom: 6px;
            color: #4b5563;
            font-weight: 600;
        }
        .campo-grupo input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .campo-grupo input:focus {
            outline: none;
            border-color: #677d29;
        }
        .btn-registro {
            background-color: #677d29;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-registro:hover {
            background-color: #526420;
        }
        .msg-resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .msg-exito {
            background-color: #def7ec;
            color: #03543f;
            border: 1px solid #bcf0da;
        }
        .msg-error {
            background-color: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #fbd5d5;
        }
    </style>
</head>
<body style="background-color: #f3f4f6;">

    <div th:replace="~{fragments/header :: admin-header}"></div>

    <div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="reg-box">
            <h2 style="color: #677d29; text-align: center; font-size: 24px; margin-bottom: 24px;">
                Autenticación de Monitor
            </h2>

            <form th:action="@{/monitor/autenticar}" method="post" th:object="${authDto}">
                <div class="campo-grupo">
                    <label for="username">Usuario de Monitor:</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="Ej: monitor" required>
                </div>

                <div class="campo-grupo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Ingrese su contraseña" required>
                </div>

                <div class="campo-grupo">
                    <label for="documento">Documento de Identidad (Opcional):</label>
                    <input type="text" id="documento" th:field="*{documento}" placeholder="Ej: 1020304050">
                </div>

                <button type="submit" class="btn-registro">Validar Monitor</button>
            </form>

            <div class="msg-resultado msg-exito" th:if="${resultado == 'exito'}">
                <h3>¡Monitor Autenticado!</h3>
                <p>Sesión verificada para <strong th:text="${monitorNombre}"></strong> (<span th:text="${monitorRol}"></span>).</p>
            </div>

            <div class="msg-resultado msg-error" th:if="${resultado == 'error'}">
                <h3>Autenticación Fallida</h3>
                <p th:text="${mensajeError}">Credenciales inválidas.</p>
            </div>
        </div>
    </div>

</body>
</html>
