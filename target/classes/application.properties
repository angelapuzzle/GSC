# Datos de conexión a la base de datos de Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/gsc_db
spring.datasource.username=gsc_user
spring.datasource.password=gsc_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Puerto por defecto del servidor Tomcat
server.port=8080